<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Responsive Navbar</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

/* navbar */
.navbar{
    display:flex;
    justify-content:center;
    align-items:center;
    background:#131313;
    padding:15px 40px;
}

/* menu */
.nav-links{
    display:flex;
    list-style:none;
}

.nav-links li{
    margin-left:25px;
}

.nav-links a{
    text-decoration:none;
    color:white;
    font-size:16px;
}

.nav-links a:hover{
    color:orange;
}

/* responsive */
@media (max-width:600px){

.navbar{
    justify-content:center;
}

/* stack vertically */
.nav-links{
    flex-direction:column;
    align-items:center;
    background:#333;
    width:100%;
    padding:15px 0;
    position:static;
}

.nav-links li{
    margin:10px 0;
}

}

</style>

</head>


<body>

<nav class="navbar">

<ul class="nav-links">
<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Services</a></li>
<li><a href="#">Contact</a></li>
</ul>

</nav>

</body>

</html>
