<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>User Details</h1>
    <fieldset>
        <legend><h1>Application Details</h1></legend>

        <label for="">Frist Name: </label> 
        <input type="text" name="firstName" id="" required>

        <br><br>

        <label for="">Last Name: </label> 
        <input type="text" name="LastName" id="" required>

        <br><br>
        <label for="">Email: </label> 
        <input type="email" name="email" id="">

        <br><br>
        <label for="">Gender: </label>
        <br>

        <br>
        <input type="radio" name="gender" id="">Male
        <br>
        <input type="radio" name="gender" id="">female

        <br><br>
        <label for="">Contact</label>
        <input type="number" name="contactNumber" id="">

        <br><br>
        <label for="">Qualification:</label>
        <input type="file" name="qualification" id="">

        <br><br>
        <label for="">Joining Date</label>
        <input type="date" name="date" id="">

        <br><br>
        <label for="">Skills</label>
        <input type="checkbox" name="js" id="">Java Script
        <input type="checkbox" name="java" id="">Java
        <br><br>
        <input type="checkbox" name="" id="">React
        <input type="checkbox" name="" id="">Express
        <br><br>
        <input type="checkbox" name="" id="">Python
        <input type="checkbox" name="" id="">Sql

        <br><br>
        <label for="">Year of Experience</label>
        <input type="range" name="" id="">

        <br><br>
        <label for="">Work location</label>
        <select name="" id="">
            <option value="">Default</option>
            <optgroup label="pune" >
                <option value="">pune</option>
                <option value="">haridaspur</option>
            </optgroup>

            <optgroup  label="punjab">
                <option value="">Jalandhar</option>
                <option value="">phagwara</option>
            </optgroup>
        </select>


        <br><br>
        <label for="">Address</label>
        <textarea name="" id=""></textarea>

        <br><br>

        <input type="submit" value="submit">
        <input type="reset" value="reset">


    </fieldset>
</body>
</html>
