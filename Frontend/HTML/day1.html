<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #header1{
            color: aqua;
        }

        .header{
            font-style: italic;
        }
    </style>
</head>
<body>


    <h1>Hello</h1>
    <h2>Hello</h2>
    <h3>Hello</h3>
    <h4>Hello</h4>
    <h5>Hello</h5>
    <h6>Hello</h6>


    <!-- Formatting Tags -->
    <b>Bold</b>
    <i>Italic</i>
    <u>Underline</u>
    <del>Deleted</del>
    <mark>Marked</mark>
    <sub>Subscript</sub>
    <sup>Superscript</sup>

    <p>H<sub>2</sub>O</p>

    
    <!-- Attributes -->

    <!-- Global/Core Attribute -->
    <h1 id="header1" class="header">Header1</h1>
    <h2 id="header2" class="header">Header2</h2>
    <h3 id="header3" class="header">Header3</h3>

    <!-- Element Specific Attribute -->
    <img src="https://images.unsplash.com/photo-1531259683007-016a7b628fc3?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Image of Batman">

</body>
</html>
