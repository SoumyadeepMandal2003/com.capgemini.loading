<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Book</title>
</head>
<body>

<h2>Add Book</h2>

<form th:action="@{/books/add}" th:object="${book}" method="post">

    <label>Title:</label><br>
    <input type="text" th:field="*{title}">
    <div th:errors="*{title}"></div><br>

    <label>Author:</label><br>
    <input type="text" th:field="*{author}">
    <div th:errors="*{author}"></div><br>

    <label>Price:</label><br>
    <input type="number" step="0.01" th:field="*{price}">
    <div th:errors="*{price}"></div><br>

    <button type="submit">Add Book</button>

</form>

<br>
<a th:href="@{/dashboard}">Back to Dashboard</a>

</body>
</html>
